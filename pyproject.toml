[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-table-ai"
version = "0.1.0"
description = "Header-preserving table chunking and numeric lookup helpers for RAG."
readme = "README.md"
authors = [
    { name = "Jake Lihua", email = "jakelihua@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "rag",
    "llm",
    "document-processing",
    "table-chunking",
    "agentic-rag",
    "deterministic-ai",
    "markdown-tables",
    "html-tables",
    "mineru",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jakelihua/rag-table-ai"
Repository = "https://github.com/jakelihua/rag-table-ai"
Issues = "https://github.com/jakelihua/rag-table-ai/issues"
